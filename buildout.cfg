### BUILDOUT CONFIG FILE ###

[buildout]
# DIRECTORIES
bin-directory = bin
parts-directory = bin/parts
develop-eggs-directory = bin/dev-eggs


# PARTS
parts =
    python
    tests
    coverage
    sphinx

# EGGS used in all parts
eggs =
    Django

# check the output for picked versions
show-picked-versions = true

# specify a version for ANY egg used :
#  - to ensure repeatability
#  - to make the buildout script run faster
#    (does not need to check for newer versions)
# check the output for picked versions

# PARTS DEFINITIONS

# the python interpreter for the buildout environment
[python]
recipe = zc.recipe.egg:script
eggs =
    ${tests:eggs}
    ${tests:runner}-django
scripts = python
interpreter = python
extra-paths = ${buildout:directory}

# the tests runner
[tests]
recipe = djangorecipebook:test
eggs =
    ${buildout:eggs}
    xmltodict
    PyYAML
runner = pytest
workingdir = tests
settings = settings
extra-paths = ${buildout:directory}

# coverage
[coverage]
<= tests
eggs =
    ${tests:eggs}
    coverage
args = --with-coverage

[sphinx]
recipe = zc.recipe.egg:script
eggs =
    sphinx
    sphinx-rtd-theme
    ${tests:eggs}
scripts = sphinx-build
extra-paths = ${buildout:directory}
initialization =
    import os
    doc_dir = os.path.join(os.path.dirname(os.path.dirname(__file__)), 'doc')
    args = [doc_dir, os.path.join(doc_dir, '_build')] + sys.argv[1:]
arguments = args

[versions]
python = 3.14

# RECIPES
zc.recipe.egg = 4.0.0
djangorecipebook = 2.0

Django = 6.1.1

alabaster = 1.0.0
asgiref = 3.12.1
babel = 2.18.0
certifi = 2026.7.22
charset-normalizer = 3.5.1
coverage = 7.16.1
docutils = 0.22.4
idna = 3.20
Jinja2 = 3.1.6
MarkupSafe = 3.0.3
pluggy = 1.6.0
Pygments = 2.21.0
pytest = 9.1.1
pytest-django = 4.14.0
PyYAML = 6.0.3
requests = 2.34.2
snowballstemmer = 3.1.1
Sphinx = 9.1.0
sphinx-rtd-theme = 3.1.0
sqlparse = 0.6.0
urllib3 = 2.8.0
xmltodict = 1.0.4

# Required by:
# pytest==9.1.1
colorama = 0.4.6

# Required by:
# Sphinx==9.1.0
imagesize = 2.0.1
roman-numerals = 4.1.0
sphinxcontrib-applehelp = 2.0.0
sphinxcontrib-devhelp = 2.0.0
sphinxcontrib-htmlhelp = 2.1.0
sphinxcontrib-jquery = 4.1
sphinxcontrib-jsmath = 1.0.1
sphinxcontrib-qthelp = 2.0.0
sphinxcontrib-serializinghtml = 2.0.0

# Required by:
# pytest==6.2.5
iniconfig = 2.3.0

# Required by:
